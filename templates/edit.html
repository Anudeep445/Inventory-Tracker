<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Product | Inventory Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <p class="eyebrow">INVENTORY</p>
    <h1>Edit Product</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form action="{{ url_for('edit', product_id=product['id']) }}" method="POST" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Name<input type="text" name="name" value="{{ product['name'] }}" required></label>
        <label>Category<input type="text" name="category" value="{{ product['category'] }}" required></label>
        <label>Quantity<input type="number" name="quantity" value="{{ product['quantity'] }}" min="0" step="1" required></label>
        <label>Price<input type="number" name="price" value="{{ product['price'] }}" min="0" step="0.01" required></label>
        <div><button type="submit" class="btn">Save Changes</button><a href="{{ url_for('index') }}" class="btn secondary">Cancel</a></div>
    </form>
</main>
</body>
</html>
