<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Inventory Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<main class="login-card">
    <a class="login-brand" href="{{ url_for('login') }}"><span class="brand-mark">IM</span><span>Inventory Manager</span></a>
    <h1>Welcome back</h1><p class="login-subtitle">Sign in to manage your inventory.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="POST" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Username<input name="username" type="text" autocomplete="username" maxlength="50" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn">Sign in</button>
    </form>
    <p class="account-link">New here? <a href="{{ url_for('register') }}">Register an account</a></p>
</main>
</body>
</html>
