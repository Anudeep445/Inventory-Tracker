<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Inventory Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<main class="login-card">
    <a class="login-brand" href="{{ url_for('login') }}"><span class="brand-mark">IM</span><span>Inventory Manager</span></a>
    <h1>Create your account</h1>
    <p class="login-subtitle">Registration creates an Inventory Staff account with view-only access.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="POST" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Full name<input name="full_name" type="text" maxlength="100" autocomplete="name" required autofocus></label>
        <label>Username<input name="username" type="text" minlength="3" maxlength="50" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Confirm password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="account-link">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</main>
</body>
</html>
